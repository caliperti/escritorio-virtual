<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gather da Shopee</title>
<link rel="icon" href="/static/assets/favicon.png">
<link rel="stylesheet" href="/static/estilo.css?v=VERSAO">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
</head>
<body>

<!-- ---------- tela de entrada ---------- -->
<div id="entrada" class="entrada">
  <div class="cartao">
    <div class="marca">
      <img src="/static/assets/logo.png" alt="Gather da Shopee" width="200" height="200">
    </div>

    <div class="abas-conta">
      <button id="aba-entrar" type="button" aria-pressed="true">Entrar</button>
      <button id="aba-criar" type="button" aria-pressed="false">Criar conta</button>
      <button id="aba-visitante" type="button" aria-pressed="false">Visitante</button>
    </div>
    <p id="vagas" class="vagas"></p>

    <label id="linha-email">Seu e-mail
      <input id="campo-email" type="email" maxlength="120" placeholder="voce@empresa.com"
             autocomplete="email" autocapitalize="off" spellcheck="false">
    </label>

    <label>Seu nome
      <input id="campo-nome" maxlength="24" placeholder="Como aparece em cima do boneco"
             autocomplete="nickname">
    </label>

    <label>Sua senha
      <input id="campo-senha" type="password" autocomplete="current-password"
             placeholder="mínimo 4 caracteres">
    </label>

    <label id="linha-convite" hidden>Código da sala
      <input id="campo-convite" type="password" autocomplete="off"
             placeholder="o código que te mandaram">
    </label>

    <div id="bonecos-visitante" class="bonecos-visitante" hidden>
      <button type="button" data-boneco="homem" aria-pressed="true">
        <img alt=""><span>Homem</span>
      </button>
      <button type="button" data-boneco="mulher" aria-pressed="false">
        <img alt=""><span>Mulher</span>
      </button>
    </div>

    <div class="editor">
      <div class="previa">
        <canvas id="previa" width="132" height="172"></canvas>
        <button id="btn-sortear" type="button" class="mini">🎲 Sortear</button>
      </div>
      <div id="opcoes" class="opcoes"></div>
    </div>

    <button id="btn-entrar" class="principal">Entrar com câmera e microfone</button>
    <button id="btn-sair-conta" class="secundario oculto">Sair desta conta</button>
    <p id="aviso-entrada" class="aviso"></p>
  </div>
</div>

<!-- ---------- aplicação ---------- -->
<div id="app" class="app oculto">
  <header class="barra">
    <div class="barra-esq">
      <img class="logo-barra" src="/static/assets/logo.png" alt="Gather da Shopee">
      <span id="zona-atual" class="chip">Recepção</span>
      <span id="contagem" class="chip fraco">1 na sala</span>
    </div>
    <div class="barra-dir">
      <!-- Ícones desenhados em SVG, não emoji: emoji muda de cara em cada
           sistema e não dá para pintar de laranja quando está ligado. -->
      <div class="grupo-icones">
        <button id="btn-mic" class="icone" title="Microfone (M)" aria-label="Microfone">
          <svg class="on" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M9 9v3a3 3 0 0 0 4.9 2.3"/><path d="M15 11.4V6a3 3 0 0 0-5.7-1.3"/><path d="M5 11a7 7 0 0 0 10.5 6"/><path d="M19 11a7 7 0 0 1-.7 3"/><path d="M12 18v3"/><path d="M3 3l18 18"/></svg>
        </button>
        <button id="btn-cam" class="icone" title="Câmera (V)" aria-label="Câmera">
          <svg class="on" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10.5l6-3.5v10l-6-3.5z"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M15 10.5l6-3.5v10l-3-1.7"/><path d="M13 6H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-2"/><path d="M3 3l18 18"/></svg>
        </button>
        <button id="btn-tela" class="icone" title="Compartilhar tela (T)" aria-label="Compartilhar tela">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 8v5"/><path d="M9.5 10.5L12 8l2.5 2.5"/></svg>
        </button>
      </div>
      <div class="grupo-icones">
        <button id="btn-reuniao" class="icone" title="Modo reunião — todos em grade (C)" aria-label="Modo reunião">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>
        </button>
        <button id="btn-boneco" class="icone" title="Editar meu boneco (B)" aria-label="Editar meu boneco">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        </button>
        <button id="btn-editor" class="icone" title="Editar o escritório (E)" aria-label="Editar o escritório">
          <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M10 21v-6h4v6"/></svg>
        </button>
      </div>
      <div class="grupo-icones">
        <button id="btn-reacao" class="icone" title="Reagir (R)" aria-label="Reagir">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01"/><path d="M15 9.5h.01"/></svg>
        </button>
        <button id="btn-sair" class="icone perigo" title="Sair" aria-label="Sair">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="palco">
    <canvas id="tela"></canvas>
    <div id="reconectando" class="reconectando oculto">
      <span class="girando"></span> Reconectando…
    </div>
    <div id="dica" class="dica">Use <kbd>W A S D</kbd> ou as setas para andar · <kbd>Enter</kbd> para o chat</div>
    <div id="videos" class="videos"></div>
    <button id="btn-fechar-reuniao" class="fechar-reuniao" hidden>✕ sair da grade (Esc)</button>
    <div class="zoom" title="Aproximar e afastar (roda do mouse, + e −, 0 volta ao padrão)">
      <button id="zoom-menos" type="button">−</button>
      <span id="zoom-nivel">100%</span>
      <button id="zoom-mais" type="button">+</button>
    </div>
  </main>

  <button id="btn-lateral" class="puxador" title="Esconder o painel (Tab)" aria-label="Esconder o painel">
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <aside class="lateral" id="lateral">
    <section class="pessoas">
      <h2>Na sala <span id="pessoas-total">1</span></h2>
      <ul id="lista-pessoas"></ul>
    </section>
    <section class="chat">
      <h2>Chat</h2>
      <div id="mensagens" class="mensagens"></div>
      <form id="form-chat">
        <select id="escopo-chat" title="Quem recebe">
          <option value="perto">Perto</option>
          <option value="todos">Todos</option>
        </select>
        <input id="campo-chat" placeholder="Escreva…" maxlength="500" autocomplete="off">
        <button type="submit">↵</button>
      </form>
    </section>
  </aside>
</div>

<!-- ---------- editor do boneco, já dentro da sala ---------- -->
<div id="modal-boneco" class="modal oculto">
  <div class="cartao">
    <h2>Seu boneco</h2>
    <label>Nome
      <input id="campo-nome-editar" maxlength="24" autocomplete="off">
    </label>
    <div class="editor">
      <div class="previa">
        <canvas id="previa-editar" width="132" height="172"></canvas>
        <button id="btn-sortear-editar" type="button" class="mini">🎲 Sortear</button>
      </div>
      <div id="opcoes-editar" class="opcoes"></div>
    </div>
    <button id="btn-salvar-boneco" class="principal">Salvar</button>
    <button id="btn-fechar-boneco" class="secundario">Cancelar</button>
  </div>
</div>

<script src="/static/boneco.js?v=VERSAO"></script>
<script src="/static/objetos.js?v=VERSAO"></script>
<script src="/static/editor.js?v=VERSAO"></script>
<script src="/static/midia.js?v=VERSAO"></script>
<script src="/static/app.js?v=VERSAO"></script>
</body>
</html>
